packages:
  - .
allowBuilds:
  "@prisma/engines": true # postinstall downloads the native schema engine used by `prisma migrate deploy`
  prisma: false # preinstall is only a Node version check
  esbuild: true # tsx
  "@parcel/watcher": false # next-intl 4.14 (extractor), prebuilt binaries
  "@swc/core": false # next-intl 4.14
  sharp: false
  unrs-resolver: false
minimumReleaseAgeExclude:
  - '@ai-sdk/anthropic@4.0.90'
  - '@ai-sdk/gateway@4.0.128'
  - '@ai-sdk/mcp@2.0.86'
  - '@ai-sdk/provider-utils@5.0.70'
  - '@ai-sdk/react@4.0.159'
  - '@aws-sdk/client-s3@3.1158.0'
  - '@aws-sdk/s3-request-presigner@3.1158.0'
  - '@hookform/resolvers@6.0.1'
  - ai@7.0.155
  - '@shadcn/registry@0.2.1'
  - shadcn@4.23.0
