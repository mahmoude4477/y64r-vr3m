# Weekly dependency audit (note 09 §2.2): stricter than the CI gate, so new advisories show up even when nobody
# pushes. A failure here on the current production commit also makes Railway skip a redeploy of that commit:
# fix it (update the dependency) before the next release.
name: Weekly dependency audit

on:
  schedule:
    - cron: "17 5 * * 1" # Monday 08:17 Riyadh
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level moderate
      - run: pnpm audit --dev --audit-level high
